# Rev — Self-Hosted Firecrawl + Supporting Services
# ====================================================
# Firecrawl provides web search + scraping as an external
# intelligence layer for the Rev M2M bridge.
#
# Usage:
#   docker compose up -d
#   export FIRECRAWL_URL=http://localhost:3002
#
# Docs: https://docs.firecrawl.dev/contributing/self-host

services:
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: rev-firecrawl
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      # Self-hosted mode (no API key required)
      - USE_DB_AUTHENTICATION=false
      # Playwright browser config
      - BROWSER_LAUNCH_TIMEOUT=60000
      - PAGE_TIMEOUT=30000
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
    volumes:
      - firecrawl-data:/app/data
    networks:
      - rev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching/queue (Firecrawl uses it internally)
  redis:
    image: redis:7-alpine
    container_name: rev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rev-network

  # Optional: Playwright service for heavy scraping
  playwright:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    container_name: rev-playwright
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      - DISPLAY=:99
    networks:
      - rev-network

volumes:
  firecrawl-data:
  redis-data:

networks:
  rev-network:
    driver: bridge
