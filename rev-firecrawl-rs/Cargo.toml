[package]
name = "rev-firecrawl"
version = "0.1.0"
edition = "2021"
description = "Self-hosted web intelligence service (Firecrawl replacement) — Rust"
authors = ["Rev"]

[[bin]]
name = "rev-firecrawl"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }

# HTML parsing
scraper = "0.20"
html2md = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL handling
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
